<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      padding: 20px;
    }

    .card {
      width: 360px;
      min-height: 480px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      cursor: pointer;
      position: relative;
    }

    /* Gift Screen */
    .gift-box {
      font-size: 80px;
      transition: transform 0.3s ease;
      user-select: none;
    }

    .card:hover .gift-box {
      transform: scale(1.1) rotate(-5deg);
    }

    .click-instruction {
      margin-top: 15px;
      font-size: 1.1rem;
      color: #ff4b2b;
      font-weight: 600;
      animation: pulse 1.5s infinite;
    }

    /* Revealed Wish Content */
    .wish-content {
      display: none;
      opacity: 0;
      transition: opacity 0.8s ease-in;
      width: 100%;
    }

    .wish-content h1 {
      font-size: 1.6rem;
      color: #d63384;
      margin-bottom: 12px;
    }

    .wish-content p {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    /* Photo Carousel Styling */
    .carousel-container {
      position: relative;
      width: 100%;
      height: 220px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .carousel-slide {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.4s ease-in-out;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.7);
      border: none;
      color: #d63384;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 50%;
      user-select: none;
      transition: background 0.2s;
    }

    .carousel-btn:hover {
      background: rgba(255, 255, 255, 0.9);
    }

    .prev-btn { left: 8px; }
    .next-btn { right: 8px; }

    /* Music Control Button */
    .music-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #ffe6ed;
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: #d63384;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 5px;
      font-weight: 600;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      opacity: 0.8;
      border-radius: 2px;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0.6; transform: scale(0.98); }
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <div class="card" id="birthdayCard">
    <!-- Music Mute/Unmute Toggle -->
    <button class="music-btn" id="musicToggle">🎵 Pause</button>

    <!-- Gift State -->
    <div id="giftState">
      <div class="gift-box">🎁</div>
      <p class="click-instruction">Tap to open your surprise! ✨</p>
    </div>

    <!-- Surprise Wish Content -->
    <div class="wish-content" id="wishContent">
      <h1>Happy Birthday, Bubu! 💖</h1>

      <!-- Photo Carousel -->
      <div class="carousel-container">
        <div class="carousel-slide" id="carouselSlide">
          <img src="photo1.jpg" alt="Memory 1">
          <img src="photo2.jpg" alt="Memory 2">
          <img src="photo3.jpg" alt="Memory 3">
        </div>
        <button class="carousel-btn prev-btn" id="prevBtn">&#10094;</button>
        <button class="carousel-btn next-btn" id="nextBtn">&#10095;</button>
      </div>

      <p>
        To the person who makes every single day brighter—thank you for being you. 
        Here’s to another year of making amazing memories together!
      </p>
    </div>
  </div>

  <script>
    const card = document.getElementById('birthdayCard');
    const giftState = document.getElementById('giftState');
    const wishContent = document.getElementById('wishContent');
    const bgMusic = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    
    let isOpen = false;

    // 1. Open Card & Start Music
    card.addEventListener('click', (e) => {
      if (e.target.classList.contains('carousel-btn') || e.target.id === 'musicToggle') {
        return;
      }

      if (isOpen) return;
      isOpen = true;

      giftState.style.display = 'none';
      wishContent.style.display = 'block';
      musicToggle.style.display = 'flex';

      setTimeout(() => {
        wishContent.style.opacity = '1';
      }, 50);

      bgMusic.play().catch(error => console.log("Audio play blocked:", error));

      createConfetti();
    });

    // 2. Music Toggle Handler
    musicToggle.addEventListener('click', () => {
      if (bgMusic.paused) {
        bgMusic.play();
        musicToggle.textContent = '🎵 Pause';
      } else {
        bgMusic.pause();
        musicToggle.textContent = '🔇 Play';
      }
    });

    // 3. Carousel Logic
    const slide = document.getElementById('carouselSlide');
    const images = slide.querySelectorAll('img');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    
    let currentIndex = 0;

    function updateCarousel() {
      slide.style.transform = `translateX(${-currentIndex * 100}%)`;
    }

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % images.length;
      updateCarousel();
    });

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      updateCarousel();
    });

    // 4. Confetti Animation
    function createConfetti() {
      const colors = ['#ff4b2b', '#ff416c', '#ff758c', '#ff7eb3', '#7f00ff', '#e100ff'];
      for (let i = 0; i < 70; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
        confetti.style.animationDelay = (Math.random() * 0.5) + 's';
        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 5000);
      }
    }
  </script>
</body>
</html>
